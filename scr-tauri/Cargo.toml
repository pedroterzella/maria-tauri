[package]
name = "maria"
version = "1.0.0"
edition = "2021"

[lib]
name = "maria_lib"
path = "scr/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "maria"
path = "scr/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
